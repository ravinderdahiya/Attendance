name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-mharidhani
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Rsync to VPS
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
        run: |
          REMOTE_PATH="${VPS_PATH:-/www/wwwroot/mharidhani.com/app}"
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'node_modules/' \
            --exclude '**/node_modules/' \
            --exclude 'admin-panel/dist/' \
            --exclude 'website/dist/' \
            --exclude 'admin-panel/.env' \
            --exclude 'website/.env' \
            --exclude 'staff_app/' \
            --exclude '.env' \
            ./ "${VPS_USER}@${VPS_HOST}:${REMOTE_PATH}/"

      - name: Docker Compose rebuild
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
        run: |
          REMOTE_PATH="${VPS_PATH:-/www/wwwroot/mharidhani.com/app}"
          ssh "${VPS_USER}@${VPS_HOST}" "cd '${REMOTE_PATH}' && \
            if [ ! -f .env ]; then cp .env.production.example .env; echo 'WARN: created .env from example'; fi && \
            grep -q '^VITE_API_BASE_URL=' .env && sed -i 's|^VITE_API_BASE_URL=.*|VITE_API_BASE_URL=|' .env || echo 'VITE_API_BASE_URL=' >> .env && \
            docker compose up -d --build && \
            docker compose exec -T backend php artisan app:ensure-manager"
