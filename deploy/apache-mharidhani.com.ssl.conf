<VirtualHost *:443>
    ServerAdmin webmaster@mharidhani.com
    ServerName mharidhani.com
    ServerAlias www.mharidhani.com
    DocumentRoot "/www/wwwroot/mharidhani.com"

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/mharidhani.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/mharidhani.com/privkey.pem

    ErrorLog "/www/wwwlogs/mharidhani.com-ssl-error_log"
    CustomLog "/www/wwwlogs/mharidhani.com-ssl-access_log" combined

    <Directory "/www/wwwroot/mharidhani.com">
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    Alias /.well-known/acme-challenge/ "/www/wwwroot/mharidhani.com/.well-known/acme-challenge/"
    <Directory "/www/wwwroot/mharidhani.com/.well-known/acme-challenge">
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto https
    ProxyPass /.well-known/acme-challenge !
    ProxyPass / http://127.0.0.1:8089/
    ProxyPassReverse / http://127.0.0.1:8089/
</VirtualHost>
