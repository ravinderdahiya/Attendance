server {
    listen 80;
    server_name _;
    client_max_body_size 25m;
    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css text/plain;

    root /usr/share/nginx/html;
    index index.html;

    # Selfie/attendance photos - a real static file behind the storage:link
    # symlink, served straight from the shared volume, never through PHP.
    location /storage/ {
        alias /var/www/storage/app/public/;
    }

    # Laravel's own API + Sanctum routes - internally rewritten to
    # index.php below, same as any stock Laravel nginx config. `root` here
    # only needs to match the PATH STRING Laravel's public/ lives at inside
    # the *backend* container (/var/www/html/public per its Dockerfile) -
    # nginx itself never reads these files, it only forwards the computed
    # SCRIPT_FILENAME to php-fpm over fastcgi, which resolves it on its own
    # filesystem. try_files always misses here (nginx has no such files
    # locally) and falls through to index.php, which is exactly what we want.
    location ~ ^/(api|sanctum) {
        root /var/www/html/public;
        try_files $uri /index.php$is_args$args;
    }

    location ~ \.php$ {
        root /var/www/html/public;
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Admin-panel SPA, built with base=/admin/ - its own index.html fallback
    # so React Router's client-side routes resolve under this subpath.
    location /admin/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    # Marketing site at the domain root.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
