<VirtualHost *:80>
    ServerAdmin webmaster@mharidhani.com
    ServerName mharidhani.com
    ServerAlias www.mharidhani.com
    DocumentRoot "/www/wwwroot/mharidhani.com"

    ErrorLog "/www/wwwlogs/mharidhani.com-error_log"
    CustomLog "/www/wwwlogs/mharidhani.com-access_log" combined

    <Directory "/www/wwwroot/mharidhani.com">
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    Alias /.well-known/acme-challenge/ "/www/wwwroot/mharidhani.com/.well-known/acme-challenge/"
    <Directory "/www/wwwroot/mharidhani.com/.well-known/acme-challenge">
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/.well-known/acme-challenge/
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>
